# deploy/compose/nats/nats.conf — NATS client auth (F114), loaded by the nats
# service in compose.yaml. One user per client, least privilege per subject:
#
#   broker   publishes and reads aikonos.* (audit, task, inbox, config events;
#            StreamTaskEvents and the alerting engine subscribe)
#   gateway  reads the audit stream only and may publish nothing, so a
#            compromised gateway or child (same uid, can read the parent's
#            env) cannot forge the events the SSE bridge shows to admins
#
# The passwords come from the nats container's environment; compose quotes
# them there, because NATS lexes an env value as config and an unquoted hex
# value such as 1e5… would parse as a number.
authorization {
  users = [
    {
      user: broker
      password: $AIKONOS_NATS_BROKER_PASSWORD
      permissions: { publish: "aikonos.>", subscribe: "aikonos.>" }
    }
    {
      user: gateway
      password: $AIKONOS_NATS_GATEWAY_PASSWORD
      permissions: { publish: { deny: ">" }, subscribe: "aikonos.audit.>" }
    }
  ]
}
