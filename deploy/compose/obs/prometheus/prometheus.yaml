global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Scrape the OTel Collector's Prometheus exporter (broker metrics forwarded here).
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  # Self-scrape for Prometheus health metrics.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
