# OpenFGA model tests: `fga model test --tests policies/fga/model.fga.yaml`
name: aikonos model tests
model_file: ./model.fga
tuples:
  - user: user:alice
    relation: owner_user
    object: agent:a1
  - user: group:ops#member
    relation: owner_group
    object: agent:a1
  - user: user:bob
    relation: member
    object: group:ops
  - user: user:carol
    relation: usable_by
    object: agent:a1
  - user: user:*
    relation: usable_by
    object: agent:default
tests:
  # AG-04: user and group owners both own and may use the agent; only a named
  # user owner may delegate; a plain user of the agent owns nothing.
  - name: agent owners
    check:
      - user: user:alice
        object: agent:a1
        assertions:
          owner: true
          can_use: true
          can_delegate_to_user: true
      - user: user:bob
        object: agent:a1
        assertions:
          owner: true
          can_use: true
          can_delegate_to_user: false
      - user: user:carol
        object: agent:a1
        assertions:
          owner: false
          can_use: true
      - user: user:dave
        object: agent:a1
        assertions:
          owner: false
          can_use: false
  # AG-01: the tenant default agent is usable by every user (user:*), and
  # owned by none.
  - name: default agent
    check:
      - user: user:dave
        object: agent:default
        assertions:
          can_use: true
          owner: false
