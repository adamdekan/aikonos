# OpenFGA model tests: `fga model test --tests policies/fga/model.fga.yaml`
name: aikonos model tests
model_file: ./model.fga
tuples:
  - user: user:alice
    relation: owner
    object: task:t1
  - user: user:alice
    relation: approver
    object: task:t1
  - user: tenant:dev
    relation: tenant
    object: task:t1
  - user: user:erin
    relation: approver
    object: tenant:dev
  - user: group:ops#member
    relation: approver
    object: tenant:dev
  - user: user:frank
    relation: admin
    object: tenant:dev
  - user: user:alice
    relation: owner_user
    object: agent:a1
  - user: group:ops#member
    relation: owner_group
    object: agent:a1
  - user: user:bob
    relation: member
    object: group:ops
  - user: user:carol
    relation: usable_by
    object: agent:a1
  - user: user:*
    relation: usable_by
    object: agent:default
  - user: agent:a1
    relation: permitted_agent
    object: mcp_connector:c1
  - user: group:ops#member
    relation: permitted_group
    object: mcp_connector:c1
  - user: user:carol
    relation: permitted_user
    object: mcp_connector:c1
tests:
  # AG-04: user and group owners both own and may use the agent; only a named
  # user owner may delegate; a plain user of the agent owns nothing.
  - name: agent owners
    check:
      - user: user:alice
        object: agent:a1
        assertions:
          owner: true
          can_use: true
          can_delegate_to_user: true
      - user: user:bob
        object: agent:a1
        assertions:
          owner: true
          can_use: true
          can_delegate_to_user: false
      - user: user:carol
        object: agent:a1
        assertions:
          owner: false
          can_use: true
      - user: user:dave
        object: agent:a1
        assertions:
          owner: false
          can_use: false
  # AG-01: the tenant default agent is usable by every user (user:*), and
  # owned by none.
  - name: default agent
    check:
      - user: user:dave
        object: agent:default
        assertions:
          can_use: true
          owner: false
  # AG-02: a user reaches a connector through a group or a direct
  # permitted_user grant; an agent grant gives the agent's users nothing.
  - name: mcp connector access
    check:
      - user: user:carol
        object: mcp_connector:c1
        assertions:
          can_access: true
      - user: user:bob
        object: mcp_connector:c1
        assertions:
          can_access: true
      - user: user:dave
        object: mcp_connector:c1
        assertions:
          can_access: false
      - user: agent:a1
        object: mcp_connector:c1
        assertions:
          can_access: true
  # Separation of duty: a task's approvers are its own (the owner) plus the
  # tenant's approvers, which include its admins and approver groups.
  - name: task approvers
    check:
      - user: user:alice
        object: task:t1
        assertions:
          can_approve: true
      - user: user:erin
        object: task:t1
        assertions:
          can_approve: true
      - user: user:bob
        object: task:t1
        assertions:
          can_approve: true
      - user: user:frank
        object: task:t1
        assertions:
          can_approve: true
      - user: user:dave
        object: task:t1
        assertions:
          can_approve: false
