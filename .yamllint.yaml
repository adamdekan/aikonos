---
extends: default
rules:
  line-length:
    max: 150
    level: warning
  comments:
    min-spaces-from-content: 1
  truthy:
    allowed-values: ["true", "false", "on", "off"]
    check-keys: false
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
ignore: |
  talos/clusterconfig/
  gen/
  .venv/
  node_modules/
