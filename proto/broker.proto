}

message AddMcpConnectionResponse {
  McpConnection connection = 1;
}

message UpdateMcpConnectionRequest {
  string tenant_id = 1;
  string user_id = 2;
  McpConnection connection = 3; // id must be set; auth_secret_ref/created_at are ignored
