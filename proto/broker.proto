  string id = 1;
}

message SetFallbackProviderResponse {}

message SetDefaultProviderForRequest {
  string capability  = 1; // chat | vision | fallback | embedding | image_generation | audio_speech | audio_transcription | rerank | ocr
  string provider_id = 2; // empty clears the capability's default
}

message SetDefaultProviderForResponse {}

message TestLlmProviderRequest {
  LlmProvider provider = 1;
  string      api_key  = 2; // write-only; omit to reuse the stored key for an existing provider
  string      mode     = 3; // modality to probe; empty = the first model's mode (default "chat")
}

message TestLlmProviderResponse {
  bool   ok          = 1;
  int32  status_code = 2; // upstream HTTP status (0 if the request never completed)
  string error       = 3; // human-readable failure reason; empty on success
  int64  latency_ms  = 4;
}

// South RPCs

message GetLlmProvidersRequest {
  string tenant_id = 1;
}

message GetLlmProvidersResponse {
  repeated LlmProvider providers = 1;
  // capability → provider id, same content as ListLlmProvidersResponse.defaults
  // — lets the gateway resolve e.g. the
  // tenant's default embedding provider without a second RPC.
  map<string, string> defaults = 2;
}

message EmitLlmUsageRequest {
  string tenant_id   = 1;
  string user_id     = 2;
  string agent_id    = 3;
  string provider    = 4;
  string model       = 5;
  int64  tokens_in   = 6;
  int64  tokens_out  = 7;
  int64  cache_read  = 8;
  int64  cache_write = 9;
  double cost        = 10;
  // Attribution dimensions for the per-call usage event row
  //. All optional — a caller that has
  // no run/session context sends them empty and the event still records.
  string run_id     = 11; // gateway run id (one chat turn / scheduled fire / reason or vision call)
  string session_id = 12; // webui chat session id; empty for scheduler/external/test callers
  string source     = 13; // chat | reason | vision | test | embedding
  // Non-per_mtok unit-quantity extension: the
  // billable quantity in the pricing unit's natural denomination (pages,
  // images, minutes…) plus that unit string, one of the catalog pricing-unit
  // values. Both zero-valued for token-billed calls — unchanged senders stay
  // valid.
  double quantity = 14;
  string unit     = 15;
}

message EmitLlmUsageResponse {}

