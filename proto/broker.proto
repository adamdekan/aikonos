syntax = "proto3";

package aikonos.broker.v1;
option go_package = "github.com/adamdekan/aikonos/gen/go/broker/v1;brokerv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "proto/audit.proto";
import "proto/plan.proto";

// BrokerService — north-bound API (frontend → Broker)
// All calls require mTLS + OIDC bearer token in metadata.
service BrokerService {
  // Create a new task from a user prompt
  rpc CreateTask(CreateTaskRequest) returns (TaskHandle);

  // Get current state of a task
  rpc GetTaskState(GetTaskStateRequest) returns (TaskState);

  // Stream task events (plan proposals, approvals, step results, completion)
  rpc StreamTaskEvents(StreamTaskEventsRequest) returns (stream TaskEvent);

  // Approve or deny a task awaiting human approval
  rpc ApproveTask(ApproveTaskRequest) returns (ApproveTaskResponse);

  // Cancel a running or pending task
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);

  // Send a task envelope to another user's agent
  rpc SendEnvelope(SendEnvelopeRequest) returns (EnvelopeHandle);

  // List pending envelopes in the user's inbox
  rpc ListInboxEnvelopes(ListInboxEnvelopesRequest) returns (ListInboxEnvelopesResponse);

  // Accept or reject an incoming envelope
  rpc RespondToEnvelope(RespondToEnvelopeRequest) returns (RespondToEnvelopeResponse);

  // Dismiss an inbox envelope (PENDING/DELIVERED → DISMISSED). No task spawn,
  // no rejection semantics — the item disappears from the inbox with a neutral audit.
  rpc DismissEnvelope(DismissEnvelopeRequest) returns (DismissEnvelopeResponse);

  // ── Personal skills — north RPCs ──

  // List the caller's own personal skills (backs the Skills view's "My skills").
  rpc ListPersonalSkills(ListPersonalSkillsRequest) returns (ListPersonalSkillsResponse);

  // Delete one of the caller's own personal skills. Owner-only, recursive,
  // bounded to that skill's own subtree.
  rpc DeletePersonalSkill(DeletePersonalSkillRequest) returns (DeletePersonalSkillResponse);

  // Snapshot-transfer a personal skill to a user or group via the envelope
  // inbox. Never grants inherited authority — the recipient's own informed
  // accept is the only path a copy lands in their own Skills/.
  rpc SendSkillTransfer(SendSkillTransferRequest) returns (SendSkillTransferResponse);

  // Recipient-only preview of a pending skill-transfer envelope: full body,
  // file manifest, injection-scan flags, and whether the name conflicts with
  // an existing skill.
  rpc GetSkillTransferPreview(GetSkillTransferPreviewRequest) returns (GetSkillTransferPreviewResponse);

  // Recipient-only accept of a pending skill-transfer envelope (rename or
  // replace). The sole accept path for a skill_transfer envelope —
  // RespondToEnvelope rejects it.
  rpc AcceptSkillTransfer(AcceptSkillTransferRequest) returns (AcceptSkillTransferResponse);

  // List the users the caller may delegate to (members of the caller's
  // delegatable groups). Discovery only — SendEnvelope re-checks authorization.
  rpc ListDelegatableUsers(ListDelegatableUsersRequest) returns (ListDelegatableUsersResponse);

  // Begin a per-user connector OAuth flow; returns the provider consent URL.
  rpc BeginConnectorAuth(BeginConnectorAuthRequest) returns (BeginConnectorAuthResponse);

  // Complete a connector OAuth flow with the returned authorization code.
  rpc CompleteConnectorAuth(CompleteConnectorAuthRequest) returns (CompleteConnectorAuthResponse);

  // List the user's linked connectors and their status.
  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse);

  // List the connector providers the deployment has OAuth credentials for. Only
  // configured providers are returned, so the UI offers exactly what can work.
  rpc ListConnectorProviders(ListConnectorProvidersRequest) returns (ListConnectorProvidersResponse);

  // Disconnect a connector (deletes its Vault secret + workspace reference).
  rpc RevokeConnector(RevokeConnectorRequest) returns (RevokeConnectorResponse);

  // ── Admin: role/relationship management (tenant-admin gated) ───────────────

  // List the tenant's curated role assignments + principal directory.
  rpc ListAssignments(ListAssignmentsRequest) returns (ListAssignmentsResponse);

  // List all registered tool vocabulary (id + required scope). Read-only;
  // works regardless of FGA state. Used to populate skill dropdowns with
  // never-yet-granted tools that tuples alone would not surface.
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);

  // Create or update a tenant skill overlay row (enable/disable, annotate,
  // set effect class). Requires tenant-admin. I1: grants no invocation capability.
  rpc UpsertSkill(UpsertSkillRequest) returns (UpsertSkillResponse);

  // Delete a tenant skill overlay row, reverting the skill to un-curated
  // defaults. Requires tenant-admin.
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteSkillResponse);

  // Grant a curated role assignment (OpenFGA tuple write).
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);

  // Revoke a curated role assignment (OpenFGA tuple delete).
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);

  // ── Scheduler: user-scheduled agentic runs ────────────────────────────────

  // Create a scheduled run (gated by the skill:scheduler capability).
  rpc CreateScheduledRun(CreateScheduledRunRequest) returns (CreateScheduledRunResponse);

  // List scheduled runs: own runs by default; owner_filter (or all) is
  // tenant-admin gated.
  rpc ListScheduledRuns(ListScheduledRunsRequest) returns (ListScheduledRunsResponse);

  // Edit a schedule, or pause/resume it (desired_state). Owner or admin.
  rpc UpdateScheduledRun(UpdateScheduledRunRequest) returns (UpdateScheduledRunResponse);

  // Delete a scheduled run. Owner or admin.
  rpc DeleteScheduledRun(DeleteScheduledRunRequest) returns (DeleteScheduledRunResponse);

  // ── Network access-list (web egress) — tenant-admin gated ─────────────────

  rpc ListNetworkRules(ListNetworkRulesRequest) returns (ListNetworkRulesResponse);
  rpc AddNetworkRule(AddNetworkRuleRequest) returns (AddNetworkRuleResponse);
  rpc DeleteNetworkRule(DeleteNetworkRuleRequest) returns (DeleteNetworkRuleResponse);

  // ── Provisioning rules (email→groups JIT mapping) — tenant-admin gated ───

  rpc ListProvisioningRules(ListProvisioningRulesRequest) returns (ListProvisioningRulesResponse);
  rpc AddProvisioningRule(AddProvisioningRuleRequest) returns (AddProvisioningRuleResponse);
  rpc DeleteProvisioningRule(DeleteProvisioningRuleRequest) returns (DeleteProvisioningRuleResponse);

  // ── MCP connections — tenant-admin gated CRUD ──────────────────────────────

  // List all MCP connections for the tenant.
  rpc ListMcpConnections(ListMcpConnectionsRequest) returns (ListMcpConnectionsResponse);

  // Add a new MCP connection (bearer token written to Vault; not returned).
  rpc AddMcpConnection(AddMcpConnectionRequest) returns (AddMcpConnectionResponse);

  // Update an existing MCP connection (bearer token optional; omit to leave unchanged).
  rpc UpdateMcpConnection(UpdateMcpConnectionRequest) returns (UpdateMcpConnectionResponse);

  // Delete an MCP connection and its Vault secret.
  rpc DeleteMcpConnection(DeleteMcpConnectionRequest) returns (DeleteMcpConnectionResponse);

  // List the MCP connections an agent is permitted to access (OpenFGA can_access check).
  rpc ListAccessibleMcpServers(ListAccessibleMcpServersRequest) returns (ListAccessibleMcpServersResponse);

  // List the tools exposed by a specific MCP server (connect + tools/list).
  // Tenant-admin gated (same as ListAccessibleMcpServers). The gateway calls
  // this during session build to register dynamic Pi tools.
  rpc ListMcpServerTools(ListMcpServerToolsRequest) returns (ListMcpServerToolsResponse);

  // ── Audit read-side: query + verify (tenant-admin gated) ─────────────────

  // Query historical audit events for the caller's tenant. Newest-first, paginated.
  rpc QueryAudit(QueryAuditRequest) returns (QueryAuditResponse);

  // Verify the integrity of the hash chain + HMAC signatures for the caller's tenant.
  rpc VerifyAuditChain(VerifyAuditChainRequest) returns (VerifyAuditChainResponse);

  // Return the per-step four-gate decision trace for a task (tenant-admin gated).
  rpc GetDecisionTrace(GetDecisionTraceRequest) returns (GetDecisionTraceResponse);
  rpc SimulatePolicy(SimulatePolicyRequest) returns (SimulatePolicyResponse);

  // ── Workspace files: per-user browser file explorer ───────────────────────
  // The acting user (verified OIDC subject) operates on their OWN workspace
  // (Root/<tenant>/<user>/) — the same dir agents read via workspace.read/doc.read.

  // List the files in the user's workspace.
  rpc ListWorkspaceFiles(ListWorkspaceFilesRequest) returns (ListWorkspaceFilesResponse);

  // Read a file's bytes (download).
  rpc ReadWorkspaceFile(ReadWorkspaceFileRequest) returns (ReadWorkspaceFileResponse);

  // Create/overwrite a file (upload). Bounded by a per-file size cap.
  rpc UploadWorkspaceFile(UploadWorkspaceFileRequest) returns (UploadWorkspaceFileResponse);

  // Delete a file.
  rpc DeleteWorkspaceFile(DeleteWorkspaceFileRequest) returns (DeleteWorkspaceFileResponse);

  // Move/rename a file or directory within the user's workspace.
  rpc MoveWorkspaceFile(MoveWorkspaceFileRequest) returns (MoveWorkspaceFileResponse);

  // Create a (possibly nested) directory in the user's workspace.
  rpc CreateWorkspaceDir(CreateWorkspaceDirRequest) returns (CreateWorkspaceDirResponse);

  // ── Platform config (tenant-admin gated) ─────────────────────────────────

  // List all config entries for the caller's tenant (with effective values + schema metadata).
  rpc GetPlatformConfig(GetPlatformConfigRequest) returns (GetPlatformConfigResponse);

  // GetObservabilityInfo returns read-only telemetry-export state. The OTLP
  // endpoint is a broker deploy-time env var (AIKONOS_OTEL_ENDPOINT) consumed
  // once at startup to build the MeterProvider — it is process-global and not
  // tenant-scoped, so it is reported here for display only, never edited.
  rpc GetObservabilityInfo(GetObservabilityInfoRequest) returns (GetObservabilityInfoResponse);

  // Set a single config key for the caller's tenant.
  rpc SetPlatformConfig(SetPlatformConfigRequest) returns (SetPlatformConfigResponse);

  // ── Alerting history (tenant-admin gated) ─────────────────────────────────

  // List recent security alerts for the caller's tenant (newest first).
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);

  // ── Agents (tenant-admin gated) ───────────────────────────────────────────

  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);

  // List the agents the caller may use (via FGA can_use). No admin gate.
  rpc ListMyAgents(ListMyAgentsRequest) returns (ListMyAgentsResponse);

  // Read/write the SOUL (personality markdown) for a named agent.
  // Caller must be the agent's owner_user or a tenant admin.
  rpc GetAgentSoul(GetAgentSoulRequest) returns (GetAgentSoulResponse);
  rpc SetAgentSoul(SetAgentSoulRequest) returns (SetAgentSoulResponse);

  // ── Agent API keys (tenant-admin gated) ──────────────────────────────────

  // Mint a new API key for a named agent. Returns the raw key exactly once.
  rpc MintAgentApiKey(MintAgentApiKeyRequest) returns (MintAgentApiKeyResponse);

  // List non-revoked API keys for an agent (prefix + label + timestamps; no raw key).
  rpc ListAgentApiKeys(ListAgentApiKeysRequest) returns (ListAgentApiKeysResponse);

  // Revoke an API key by id.
  rpc RevokeAgentApiKey(RevokeAgentApiKeyRequest) returns (RevokeAgentApiKeyResponse);

  // ── Agent skill bundles (tenant-admin gated) ──────────────────────────────

  // Create or update an agent skill bundle (SKILL.md upload). Requires tenant-admin.
  rpc UpsertAgentSkill(UpsertAgentSkillRequest) returns (UpsertAgentSkillResponse);

  // List all agent skill bundles for the caller's tenant. Requires tenant-admin.
  rpc ListAgentSkills(ListAgentSkillsRequest) returns (ListAgentSkillsResponse);

  // Get a single agent skill bundle by id. Requires tenant-admin.
  rpc GetAgentSkill(GetAgentSkillRequest) returns (GetAgentSkillResponse);

  // Delete an agent skill bundle. Requires tenant-admin.
  rpc DeleteAgentSkill(DeleteAgentSkillRequest) returns (DeleteAgentSkillResponse);

  // ── LLM providers (tenant-admin gated) ───────────────────────────────────

  // List the tenant's configured LLM providers (api_key never returned).
  rpc ListLlmProviders(ListLlmProvidersRequest) returns (ListLlmProvidersResponse);

  // Create or update a provider; api_key is write-only (stored in Vault).
  rpc UpsertLlmProvider(UpsertLlmProviderRequest) returns (UpsertLlmProviderResponse);

  // Delete a provider and its Vault key (best-effort).
  rpc DeleteLlmProvider(DeleteLlmProviderRequest) returns (DeleteLlmProviderResponse);

  // Mark a provider as the tenant default (clears any prior default).
  rpc SetDefaultProvider(SetDefaultProviderRequest) returns (SetDefaultProviderResponse);

  // Mark a provider as the tenant default-vision provider (clears any prior
  // default-vision). Rejects if the target provider isn't vision_capable.
  rpc SetDefaultVisionProvider(SetDefaultVisionProviderRequest) returns (SetDefaultVisionProviderResponse);

  // Mark a provider as the tenant fallback (clears any prior fallback). No
  // capability guard: a fallback serves chat, so vision_capable is irrelevant
  // here — the gateway checks it at vision-selection time.
  rpc SetFallbackProvider(SetFallbackProviderRequest) returns (SetFallbackProviderResponse);

  // Set (or clear, with an empty provider_id) the tenant's default provider for
  // one capability. Generalizes the three SetX RPCs above, which now write the
  // same llm_provider_defaults row through this same path.
  rpc SetDefaultProviderFor(SetDefaultProviderForRequest) returns (SetDefaultProviderForResponse);

  // Probe a provider's endpoint/key with one minimal request before saving.
  // api_key is write-only; omit to reuse the stored key when testing an existing provider.
  rpc TestLlmProvider(TestLlmProviderRequest) returns (TestLlmProviderResponse);

  // ── M365 tenant connection (Entra OBO) — admin only ───────────────────────
  // Tenant-wide OneDrive access via on-behalf-of (OBO) exchange of the
  // caller's own Entra login bearer. One connection per tenant.
  // client_secret is write-only (stored in Vault); responses report
  // has_secret only.

  // Read the tenant's M365 connection (zero-value connection when unconfigured).
  rpc GetM365Connection(GetM365ConnectionRequest) returns (GetM365ConnectionResponse);

  // Create or update the tenant's M365 connection; client_secret is
  // write-only. Blank client_secret on an update preserves the stored secret.
  rpc UpsertM365Connection(UpsertM365ConnectionRequest) returns (UpsertM365ConnectionResponse);

  // Remove the tenant's M365 connection (clears metadata + deletes the Vault secret).
  rpc DeleteM365Connection(DeleteM365ConnectionRequest) returns (DeleteM365ConnectionResponse);

  // Probe the connection with a real OBO exchange using the caller's own
  // bearer as the assertion. Classifies known AADSTS failure codes into an
  // actionable detail string.
  rpc TestM365Connection(TestM365ConnectionRequest) returns (TestM365ConnectionResponse);

  // ── web.search engine config — admin only ──────
  // Org-wide search-engine config for the web.search tool. api_key is
  // write-only (stored in Vault); responses report has_key only.

  // Read the tenant's web.search config (zero-value config when unconfigured).
  rpc GetWebSearchConfig(GetWebSearchConfigRequest) returns (GetWebSearchConfigResponse);

  // Create or update the tenant's web.search config; api_key is write-only.
  // Blank api_key on an update preserves the stored key.
  rpc UpsertWebSearchConfig(UpsertWebSearchConfigRequest) returns (UpsertWebSearchConfigResponse);

  // Remove the tenant's web.search config (clears metadata + deletes the Vault key).
  rpc DeleteWebSearchConfig(DeleteWebSearchConfigRequest) returns (DeleteWebSearchConfigResponse);

  // Probe the configured engine with one minimal query using the supplied-or-
  // stored key. Never persists.
  rpc TestWebSearchConfig(TestWebSearchConfigRequest) returns (TestWebSearchConfigResponse);

  // ── Per-user workspace-backend preference (CP5) — no admin gate ─────────
  // Which storage backend (local disk vs the tenant's OneDrive OBO
  // connection) the caller's Files explorer/composer/agent tools currently
  // route to.

  // Read the caller's effective workspace-backend preference (default-rule
  // resolved when no row has ever been explicitly set).
  rpc GetWorkspaceBackend(GetWorkspaceBackendRequest) returns (GetWorkspaceBackendResponse);

  // Set the caller's working-folder preference. backend="onedrive" ensures
  // the OBO connection and the folder (creating it if needed) before saving.
  rpc SetWorkspaceBackend(SetWorkspaceBackendRequest) returns (SetWorkspaceBackendResponse);

  // List folders (children only, no files) at path relative to the drive
  // root — backs the working-folder picker, which browses the whole drive.
  rpc ListOneDriveFolders(ListOneDriveFoldersRequest) returns (ListOneDriveFoldersResponse);

  // ── Rate limit management — admin only ────────────────────────────────────
  rpc ListRateLimitPolicies(ListRateLimitPoliciesRequest) returns (ListRateLimitPoliciesResponse);
  rpc SetRateLimitPolicy(SetRateLimitPolicyRequest)       returns (SetRateLimitPolicyResponse);
  rpc DeleteRateLimitPolicy(DeleteRateLimitPolicyRequest) returns (DeleteRateLimitPolicyResponse);

  // ── Spend cap management — admin only ──────────
  rpc ListSpendCaps(ListSpendCapsRequest)     returns (ListSpendCapsResponse);
  rpc SetSpendCap(SetSpendCapRequest)         returns (SetSpendCapResponse);
  rpc DeleteSpendCap(DeleteSpendCapRequest)   returns (DeleteSpendCapResponse);
  rpc GetSpendSummary(GetSpendSummaryRequest) returns (GetSpendSummaryResponse);

  // ── Per-session usage — caller's own sessions only ────────────────────────
  // Rolls one chat session's billable LLM calls up by (provider, model) for the
  // webui's per-session usage strip. Not admin-gated and deliberately not a
  // tenant-wide surface: the handler scopes the query to the calling user, so a
  // caller can only ever read a session they ran.
  rpc GetSessionUsage(GetSessionUsageRequest) returns (GetSessionUsageResponse);

  // ── Org governance settings (A-series) — admin only ───────────────────────
  // Tenant-scoped org control plane: a single settings object per tenant.
  // GetOrgSettings returns the full object (defaults when unset); UpdateOrgSettings
  // applies only the fields present on the request (partial merge).
  rpc GetOrgSettings(GetOrgSettingsRequest)       returns (GetOrgSettingsResponse);
  rpc UpdateOrgSettings(UpdateOrgSettingsRequest) returns (UpdateOrgSettingsResponse);

  // A3 — unified members roster (read-only aggregation). Admin only.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);

  // ── Workflow RPCs (north/OIDC path) — reuse south message types ──────────
  // owner_grant is ignored on the north path; identity comes from the OIDC bearer.
  rpc SaveWorkflow(SaveWorkflowRequest)   returns (SaveWorkflowResponse);
  rpc GetWorkflow(GetWorkflowRequest)     returns (GetWorkflowResponse);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);

  // ── Workflow self-improvement RPCs (CP6b) ─────────────────────────────────
  // owner_grant is ignored on the north path; identity comes from the OIDC bearer.
  rpc RateWorkflowRun(RateWorkflowRunRequest)           returns (RateWorkflowRunResponse);
  rpc ProposeWorkflowVersion(ProposeWorkflowVersionRequest) returns (ProposeWorkflowVersionResponse);
  rpc DecideWorkflowVersion(DecideWorkflowVersionRequest)   returns (DecideWorkflowVersionResponse);

  // ── Workflow publish RPC (CP7) ────────────────────────────────────────────
  // Publishes a success-rated version to the owner's groups.
  // owner_grant is ignored on the north path; identity comes from the OIDC bearer.
  rpc PublishWorkflow(PublishWorkflowRequest) returns (PublishWorkflowResponse);

  // ── Workflow fork + version-pin RPCs (CP9) ───────────────────────────────
  // ForkWorkflow creates a new independent lineage (v1) copied from the source
  // lineage's current approved definition. owner_grant is ignored on the north
  // path; identity comes from the OIDC bearer.
  rpc ForkWorkflow(ForkWorkflowRequest) returns (ForkWorkflowResponse);
  // SetWorkflowVersionPin pins the caller's personal view to a specific approved
  // version. ClearWorkflowVersionPin removes the pin (reverts to auto-latest).
  rpc SetWorkflowVersionPin(SetWorkflowVersionPinRequest) returns (SetWorkflowVersionPinResponse);
  rpc ClearWorkflowVersionPin(ClearWorkflowVersionPinRequest) returns (ClearWorkflowVersionPinResponse);
  // ListWorkflowVersions returns all versions for a lineage (CP10c version switcher).
  rpc ListWorkflowVersions(ListWorkflowVersionsRequest) returns (ListWorkflowVersionsResponse);

  // DeleteWorkflow removes an entire workflow lineage (all versions + pins).
  // Owner-only. Deleting a published lineage also removes it for every group it
  // was shared with. owner_grant is ignored on the north path; identity comes
  // from the OIDC bearer.
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (DeleteWorkflowResponse);

  // BeginWorkflowRun (F9) authorizes an agent-bound workflow run for the caller
  // and mints the owner grant the gateway needs to drive the run on the south
  // (CreateGatewayTask) path under the bound agent's identity. For an unbound
  // (personal) workflow it returns empty fields — the gateway keeps the legacy
  // personal north path. North-only: the webui run button is the sole caller;
  // the chat path (workflow_run Pi tool) is unchanged.
  rpc BeginWorkflowRun(BeginWorkflowRunRequest) returns (BeginWorkflowRunResponse);

  // ── Agent memory management ───────────────────
  // The settings-modal Memory surface. Identity is bound from the OIDC bearer
  // (callerIdentity); the explicit tenant_id/user_id fields may only echo it.
  // Per-scope authorization: user → self; group → member/manager for reads,
  // manager (or tenant admin) to manage; agent → tenant admin either way.

  // Groups whose memory bundle the caller may see, with the member/manager
  // relations that decide which actions the UI offers. Discovery only.
  rpc ListMemoryGroups(ListMemoryGroupsRequest) returns (ListMemoryGroupsResponse);

  // Frontmatter metadata for every concept in one scope instance.
  rpc ListMemoryConcepts(ListMemoryConceptsRequest) returns (ListMemoryConceptsResponse);

  // One concept's metadata plus its raw body (human display — unlike
  // memory.read's concept mode, this is not model context and is not
  // injection-annotated).
  rpc GetMemoryConcept(GetMemoryConceptRequest) returns (GetMemoryConceptResponse);

  // Record a human verification on a concept — the only writer of `verified`
  // anywhere, which is what earns a concept the human-reviewed trust tier.
  rpc VerifyMemoryConcept(VerifyMemoryConceptRequest) returns (VerifyMemoryConceptResponse);

  // Mark a concept deprecated. Content is preserved (OKF supersession).
  rpc DeprecateMemoryConcept(DeprecateMemoryConceptRequest) returns (DeprecateMemoryConceptResponse);

  // Hard-delete a concept file. The management-UI-only escape hatch.
  rpc DeleteMemoryConcept(DeleteMemoryConceptRequest) returns (DeleteMemoryConceptResponse);
}

// SandboxService — south-bound API (sandbox → Broker)
// All calls require SPIFFE SVID mTLS — no OIDC.
service SandboxService {
  // Sandbox submits a plan for validation
  rpc SubmitPlan(SubmitPlanRequest) returns (aikonos.plan.v1.PlanValidationResult);

  // Sandbox invokes a tool (proxied through Tool Proxy)
  rpc InvokeTool(InvokeToolRequest) returns (InvokeToolResponse);

  // Sandbox reports status updates
  rpc EmitStatus(EmitStatusRequest) returns (EmitStatusResponse);

  // Sandbox requests a sub-agent (depth-limited)
  // Reserved: unimplemented Phase-4 surface; delegation-scope derivation tracked by the security workstream.
  rpc RequestSubagent(RequestSubagentRequest) returns (SubagentHandle);

  // Gateway scheduler ticker claims due scheduled runs to fire. SPIFFE-gated to
  // the agent-gateway identity (these advance state, so not any sandbox).
  rpc ClaimDueScheduledRuns(ClaimDueScheduledRunsRequest) returns (ClaimDueScheduledRunsResponse);

  // Gateway reports the outcome of a fired scheduled run.
  rpc ReportScheduledRunResult(ReportScheduledRunResultRequest) returns (ReportScheduledRunResultResponse);

  // Gateway queries which MCP connections an agent may access (FGA filtered).
  // SPIFFE-gated to the agent-gateway identity — NOT tenant-admin.
  // Called during session build for a non-admin user's agent.
  rpc ListAccessibleMcpServersForAgent(ListAccessibleMcpServersRequest) returns (ListAccessibleMcpServersResponse);

  // Gateway lists the tools exposed by an MCP server the agent may access.
  // SPIFFE-gated to the agent-gateway identity — NOT tenant-admin.
  rpc ListMcpServerToolsSouth(ListMcpServerToolsRequest) returns (ListMcpServerToolsResponse);

  // Gateway reads the tenant's configured LLM model override.
  // SPIFFE-gated to the agent-gateway identity. Returns empty string when no
  // override is set — the gateway falls back to its env default. Convenience-
  // only: does not affect any gate, scope, or approval decision.
  rpc GetTenantModel(GetTenantModelRequest) returns (GetTenantModelResponse);

  // Gateway fetches all enabled LLM providers for the tenant, including api_key.
  // SPIFFE-gated to the agent-gateway identity.
  rpc GetLlmProviders(GetLlmProvidersRequest) returns (GetLlmProvidersResponse);

  // Gateway emits token-usage telemetry after each LLM turn.
  // SPIFFE-gated to the agent-gateway identity.
  rpc EmitLlmUsage(EmitLlmUsageRequest) returns (EmitLlmUsageResponse);

  // Gateway calls this before each LLM request to check TPM limits.
  rpc CheckRateLimit(CheckRateLimitRequest) returns (CheckRateLimitResponse);

  // Gateway fetches org governance settings at session-resolution time
  // (instruction preamble, unattended-mode master, …). SPIFFE-gated to the
  // gateway identity; read-only. Returns defaults when unset for the tenant.
  rpc GetOrgSettings(GetOrgSettingsRequest) returns (GetOrgSettingsResponse);

  // Gateway fetches the config of a named agent before building a session.
  // SPIFFE-gated to the agent-gateway identity. Returns found=false when the
  // agent id is unknown or agents are disabled — caller falls back to defaults.
  rpc GetAgentSpec(GetAgentSpecRequest) returns (GetAgentSpecResponse);

  // Gateway creates a task on behalf of a user (south twin of BrokerService.CreateTask).
  // SPIFFE-gated to the agent-gateway identity; owner is the gateway-asserted user.
  rpc CreateGatewayTask(CreateGatewayTaskRequest) returns (TaskHandle);

  // Gateway approves a task and mints per-step capability tokens (south twin of
  // BrokerService.ApproveTask). SPIFFE-gated to the agent-gateway identity.
  rpc ApproveGatewayTask(ApproveGatewayTaskRequest) returns (ApproveTaskResponse);

  // Gateway resolves a raw API key sha256 hash to the agent + service principal.
  // SPIFFE-gated to the agent-gateway identity. Returns valid=false on miss/revoke.
  rpc ResolveAgentApiKey(ResolveAgentApiKeyRequest) returns (ResolveAgentApiKeyResponse);

  // Gateway lists the skills (tool_id → scope) the given user may invoke.
  // SPIFFE-gated to the agent-gateway identity.
  // When FGA is disabled the full registry is returned. When FGA is enabled,
  // each tool is checked with CheckFGA(user:userId, can_invoke, skill:toolId);
  // tools where the check fails are silently omitted (fail-closed per-tool).
  rpc ListUserSkills(ListUserSkillsRequest) returns (ListUserSkillsResponse);

  // Gateway lists the agent skill bundles the given user may activate
  // (CheckFGA(user, can_use, agentskill:<id>)). SPIFFE-gated to the
  // agent-gateway identity. When FGA is disabled, all tenant bundles are
  // returned.
  rpc ListUserAgentSkills(ListUserAgentSkillsRequest) returns (ListUserAgentSkillsResponse);

  // Gateway reads one file out of an agent skill bundle's full tree
  // for the read_skill_file Pi tool. Re-checks
  // the same per-bundle CheckFGA(user, can_use, agentskill:<id>) gate as
  // ListUserAgentSkills. SPIFFE-gated to the agent-gateway identity. NotFound
  // for an unknown bundle id, an ungranted user, or an unknown path.
  rpc GetAgentSkillFileSouth(GetAgentSkillFileSouthRequest) returns (GetAgentSkillFileSouthResponse);

  // Gateway persists a private Workflow authored from a session transcript.
  // SPIFFE-gated to the agent-gateway identity; owner is bound from owner_grant.
  rpc SaveWorkflow(SaveWorkflowRequest) returns (SaveWorkflowResponse);

  // Gateway fetches a workflow definition for execution. Resolves pin-or-current
  // version for the requesting user. SPIFFE-gated to the agent-gateway identity;
  // owner is bound from owner_grant.
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);

  // Gateway lists the workflows owned by the requesting user.
  // SPIFFE-gated to the agent-gateway identity; owner is bound from owner_grant.
  // Requires skill:workflows (deny-by-default).
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);

  // ── Workflow self-improvement RPCs (CP6b) ─────────────────────────────────
  // SPIFFE-gated to the agent-gateway identity; owner is bound from owner_grant.
  rpc RateWorkflowRun(RateWorkflowRunRequest)           returns (RateWorkflowRunResponse);
  rpc ProposeWorkflowVersion(ProposeWorkflowVersionRequest) returns (ProposeWorkflowVersionResponse);
  rpc DecideWorkflowVersion(DecideWorkflowVersionRequest)   returns (DecideWorkflowVersionResponse);

  // ── Workflow publish RPC (CP7) ────────────────────────────────────────────
  // SPIFFE-gated to the agent-gateway identity; owner is bound from owner_grant.
  rpc PublishWorkflow(PublishWorkflowRequest) returns (PublishWorkflowResponse);

  // ── Workflow fork + version-pin RPCs (CP9) ───────────────────────────────
  // SPIFFE-gated to the agent-gateway identity; owner is bound from owner_grant.
  rpc ForkWorkflow(ForkWorkflowRequest) returns (ForkWorkflowResponse);
  rpc SetWorkflowVersionPin(SetWorkflowVersionPinRequest) returns (SetWorkflowVersionPinResponse);
  rpc ClearWorkflowVersionPin(ClearWorkflowVersionPinRequest) returns (ClearWorkflowVersionPinResponse);
  // ListWorkflowVersions returns all versions for a lineage (CP10c version switcher).
  rpc ListWorkflowVersions(ListWorkflowVersionsRequest) returns (ListWorkflowVersionsResponse);

  // Gateway lists the memory concepts available for auto-recall on one turn:
  // the user's own bundle, every member group's bundle, and (when agent_id is
  // passed and that agent's skills include memory.read) the agent's bundle.
  // SPIFFE-gated to the agent-gateway identity. Frontmatter only, never bodies.
  // Returns empty — never an error — when the user lacks skill:memory.read, so
  // revoking the grant silences auto-recall with no gateway change.
  rpc ListMemoryConceptsSouth(ListMemoryConceptsRequest) returns (ListMemoryConceptsResponse);

  // Gateway lists the caller's own Skills/*/SKILL.md catalog for session-build
  // union. Frontmatter only,
  // never bodies. SPIFFE-gated to the agent-gateway identity. Returns empty —
  // never an error — when the user lacks skill:personal-skills, when FGA
  // errors, or for a svc-/group- prefixed user_id (no agent/group personal
  // skills).
  rpc ListPersonalSkillsSouth(ListPersonalSkillsSouthRequest) returns (ListPersonalSkillsSouthResponse);

  // Gateway fetches one personal skill's body for on-demand load_skill
  // activation. SPIFFE-gated to the agent-gateway identity. NotFound for a
  // missing/invalid skill, an ungranted user, an FGA error, or a svc-/group-
  // prefixed user_id — never a transport error distinguishing those cases.
  rpc GetPersonalSkillSouth(GetPersonalSkillSouthRequest) returns (GetPersonalSkillSouthResponse);

  // Gateway reads one file out of a personal skill's full tree
  // for the read_skill_file Pi tool. Same
  // svc-/group- rejection and skill:personal-skills gating posture as
  // GetPersonalSkillSouth. SPIFFE-gated to the agent-gateway identity.
  // NotFound for a missing skill, an ungranted user, or an unknown path.
  rpc GetPersonalSkillFileSouth(GetPersonalSkillFileSouthRequest) returns (GetPersonalSkillFileSouthResponse);
}

// ── Task types ────────────────────────────────────────────────────────────────

message CreateTaskRequest {
  string tenant_id = 1;
  string user_id = 2;
  string prompt = 3;                // Natural language task description
  int64 cost_budget = 4;            // Max cost units; 0 = use user default
  google.protobuf.Timestamp deadline = 5;  // 0 = use task class default
  repeated string skill_hints = 6;  // Suggested skills (agent may ignore)
  string parent_task_id = 7;        // Set when spawned from an envelope
  string client_request_id = 8;     // Optional idempotency key; empty = today's behavior
}

message TaskHandle {
  string task_id = 1;
  string trace_id = 2;
}

message GetTaskStateRequest {
  string task_id = 1;
  string tenant_id = 2;
}

message TaskState {
  string task_id = 1;
  TaskStatus status = 2;
  int64 cost_consumed = 3;
  int64 cost_budget = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  string current_step_description = 7;
  repeated string violations = 8;   // If DENIED, why
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  CREATED           = 1;
  PLANNING          = 2;
  VALIDATING        = 3;
  AWAITING_APPROVAL = 4;
  APPROVED          = 5;
  EXECUTING         = 6;
  COMPLETED         = 7;
  FAILED            = 8;
  DENIED            = 9;
  CANCELLED         = 10;
  TERMINATED        = 11;
  TIMEOUT           = 12;
}

message StreamTaskEventsRequest {
  string task_id = 1;
  string tenant_id = 2;
}

message TaskEvent {
  string event_id = 1;
  string task_id = 2;
  TaskEventType type = 3;
  google.protobuf.Struct payload = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

enum TaskEventType {
  TASK_EVENT_TYPE_UNSPECIFIED = 0;
  STATUS_CHANGED   = 1;
  PLAN_PROPOSED    = 2;
  STEP_STARTED     = 3;
  STEP_COMPLETED   = 4;
  STEP_FAILED      = 5;
  APPROVAL_NEEDED  = 6;
  APPROVAL_RECEIVED = 7;
  RESULT_READY     = 8;
  ERROR            = 9;
}

message ApproveTaskRequest {
  string task_id = 1;
  string tenant_id = 2;
  bool approved = 3;
  string reason = 4;
  string approver_user_id = 5;
}

message ApproveTaskResponse {
  bool success = 1;
  TaskStatus new_status = 2;
  // Per-step capability tokens minted when this approval resolves the task to
  // APPROVED, keyed by plan-step seq (base64 Biscuit). Empty unless the
  // approval just transitioned the task to APPROVED. Mirrors
  // PlanValidationResult.capability_token_ids for the human-approval path.
  map<int32, string> capability_token_ids = 3;
}

message CancelTaskRequest {
  string task_id = 1;
  string tenant_id = 2;
  string reason = 3;
}

message CancelTaskResponse {
  bool success = 1;
}

// ── Envelope types ────────────────────────────────────────────────────────────

message SendEnvelopeRequest {
  string from_user_id = 1;
  string tenant_id = 2;
  EnvelopeRecipient recipient = 3;
  EnvelopeTask task = 4;
  EnvelopeDelegation delegation = 5;
}

message EnvelopeRecipient {
  oneof target {
    string user_id = 1;
    string group_id = 2;
    string role = 3;
  }
}

message EnvelopeTask {
  string intent = 1;
  string payload_ref = 2;           // Object storage reference for large payloads
  repeated string required_skills = 3;
  google.protobuf.Timestamp deadline = 4;
  string priority = 5;              // normal | high | low
  // kind discriminates the envelope's handling path — empty (legacy/ordinary
  // delegation) or "skill_transfer".
  // A skill_transfer envelope is rejected by RespondToEnvelope; its accept
  // path is AcceptSkillTransfer only.
  string kind = 6;
}

message EnvelopeDelegation {
  string capability_token = 1;      // Biscuit token (serialized)
  repeated string attenuated_scopes = 2;
  int64 max_cost_units = 3;
}

message EnvelopeHandle {
  string envelope_id = 1;
  string trace_id = 2;
}

message ListInboxEnvelopesRequest {
  string user_id = 1;
  string tenant_id = 2;
  bool include_accepted = 3;
  // F19: additive pagination, following the audit-reader cursor convention.
  // limit=0 (proto3 default) → legacy behavior: the existing 100-row cap,
  // unpaged.
  int32  limit  = 4;
  string cursor = 5; // opaque; empty = first page
}

message ListInboxEnvelopesResponse {
  repeated InboxEnvelope envelopes = 1;
  string next_cursor = 2; // empty = no more (F19)
}

message InboxEnvelope {
  string envelope_id = 1;
  string from_user_id = 2;
  EnvelopeTask task = 3;
  google.protobuf.Timestamp received_at = 4;
  string status = 5;   // pending | accepted | rejected | completed
  string from_display_name = 6;   // directory display name; empty if unresolved
}

message RespondToEnvelopeRequest {
  string envelope_id = 1;
  string user_id = 2;
  string tenant_id = 3;
  bool accepted = 4;
  string reason = 5;
}

message RespondToEnvelopeResponse {
  bool success = 1;
}

message DismissEnvelopeRequest {
  string envelope_id = 1;
  string user_id = 2;
  string tenant_id = 3;
}

message DismissEnvelopeResponse {
  bool success = 1;
}

message ListDelegatableUsersRequest {
  string user_id = 1;
  string tenant_id = 2;
}

message ListDelegatableUsersResponse {
  repeated DelegatableUser users = 1;
  repeated DelegatableGroup groups = 2;
}

message DelegatableUser {
  string user_id = 1;
  string display_name = 2;   // directory label; falls back to user_id when unknown
}

message DelegatableGroup {
  string group_id = 1;
  string display_name = 2;   // directory label; falls back to group_id when unknown
  int32 member_count = 3;    // members excluding the caller
}

// ── Personal skills — north RPCs ──

message ListPersonalSkillsRequest {
  string tenant_id = 1;
  string user_id   = 2;
}

message ListPersonalSkillsResponse {
  repeated PersonalSkillListEntry skills = 1;
}

// PersonalSkillListEntry is one of the caller's own Skills/<name>/ rows,
// backing the Skills view's "My skills" section — PersonalSkillEntry (the
// south catalog row) plus size_bytes, the folder's total content size.
message PersonalSkillListEntry {
  string          name                     = 1;
  string          description              = 2;
  repeated string keywords                 = 3;
  repeated string allowed_tools            = 4;
  bool            disable_model_invocation = 5;
  bool            valid                    = 6;
  string          warning                  = 7;
  int64           size_bytes               = 8;
}

message DeletePersonalSkillRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string name      = 3;
}

message DeletePersonalSkillResponse {}

message SendSkillTransferRequest {
  string            tenant_id = 1;
  string            user_id   = 2; // sender, bound via callerIdentity
  string            name      = 3;
  // Reuses EnvelopeRecipient (user_id | group_id | role) — the role arm is
  // rejected the same way SendEnvelope rejects it.
  EnvelopeRecipient recipient = 4;
}

message SendSkillTransferResponse {
  repeated string envelope_ids     = 1; // one per delivered recipient
  repeated string skipped_user_ids = 2; // group send only: granted-but-skipped members
}

message GetSkillTransferPreviewRequest {
  string tenant_id   = 1;
  string user_id     = 2; // recipient, bound via callerIdentity
  string envelope_id = 3;
}

message GetSkillTransferPreviewResponse {
  string                      skill_name   = 1;
  string                      from_user_id = 2;
  string                      body         = 3; // markdown after the frontmatter fence
  repeated SkillManifestEntry manifest     = 4;
  repeated string             flags        = 5;
  string                      content_hash = 6;
  bool                        conflict     = 7; // recipient already has Skills/<skill_name>/
}

message SkillManifestEntry {
  string path = 1;
  int64  size = 2;
}

message AcceptSkillTransferRequest {
  string tenant_id     = 1;
  string user_id       = 2; // recipient, bound via callerIdentity
  string envelope_id   = 3;
  string mode          = 4; // "rename" (default) | "replace"
  string name_override = 5; // rename mode only; ignored for replace
}

message AcceptSkillTransferResponse {
  string installed_name = 1;
}

// ── Sandbox south-bound types ──────────────────────────────────────────────────

message SubmitPlanRequest {
  string task_id = 1;
  string sandbox_spiffe_id = 2;
  aikonos.plan.v1.Plan plan = 3;
}

message InvokeToolRequest {
  string task_id = 1;
  string step_id = 2;
  string tool_id = 3;
  google.protobuf.Struct args = 4;
  string capability_token = 5;      // Biscuit token for this specific step
  string sandbox_spiffe_id = 6;
  // Tenant that owns the task. South-bound calls carry no OIDC tenant, so the
  // caller echoes it (from its task assignment) for the per-tenant Tool Proxy
  // workspace path + RLS lookup. Mirrors EmitStatusRequest.tenant_id.
  string tenant_id = 7;
  // Owning user — selects the per-user workspace (Root/<tenant>/<user>/) so a
  // user's documents persist across tasks/conversations. Empty falls back to
  // the task id (server-side executor path).
  string user_id = 8;
  // Agent identity for the per-call RBAC re-check on MCP tool invocations.
  // Must be set for any mcp:<C>:<tool> call; empty → denied.
  string agent_id = 9;
}

message InvokeToolResponse {
  bool success = 1;
  google.protobuf.Struct result = 2;
  string error = 3;
  int64 cost_units_consumed = 4;
}

message EmitStatusRequest {
  string task_id = 1;
  string sandbox_spiffe_id = 2;
  TaskStatus status = 3;
  string description = 4;
  int64 cost_units_consumed = 5;
  // Tenant that owns the task. South-bound calls carry no OIDC tenant, so the
  // sandbox must echo it (from its task assignment) for per-tenant RLS lookup.
  string tenant_id = 6;
}

message EmitStatusResponse {}

message RequestSubagentRequest {
  string parent_task_id = 1;
  string sandbox_spiffe_id = 2;
  string intent = 3;
  repeated string required_skills = 4;
  int64 cost_budget = 5;
}

message SubagentHandle {
  string subtask_id = 1;
  string capability_token = 2;
}

// ── Connector (per-user external-storage OAuth) types ────────────────────────

enum ConnectorProvider {
  CONNECTOR_PROVIDER_UNSPECIFIED = 0;
  GOOGLE_DRIVE = 1;
  ONEDRIVE = 2;
}

message BeginConnectorAuthRequest {
  // tenant_id (UUID) and user_id are echoed for south-style validation; the
  // broker prefers the OIDC identity from context when present.
  string tenant_id = 1;
  string user_id = 2;
  ConnectorProvider provider = 3;
  // Optional scope override; empty → provider defaults.
  repeated string scopes = 4;
}

message BeginConnectorAuthResponse {
  string authorize_url = 1;
  string state = 2;
}

message CompleteConnectorAuthRequest {
  string tenant_id = 1;
  string user_id = 2;
  string code = 3;
  string state = 4;
}

message CompleteConnectorAuthResponse {
  string connector_id = 1;
  string status = 2;
  repeated string scopes = 3;
}

message ListConnectorsRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message ConnectorStatus {
  string connector_id = 1;
  ConnectorProvider provider = 2;
  string display_name = 3;
  repeated string scopes = 4;
  string status = 5;
  google.protobuf.Timestamp connected_at = 6;
  // True when this connector is under a tenant-wide connection rather than the
  // user's own per-user OAuth link — Revoke/reconnect don't apply to it.
  bool managed = 7;
}

message ListConnectorsResponse {
  repeated ConnectorStatus connectors = 1;
}

message ListConnectorProvidersRequest {}

// One provider the deployment can offer. Carries no secrets — display metadata only.
message ConnectorProviderInfo {
  ConnectorProvider provider = 1;   // enum (GOOGLE_DRIVE / ONEDRIVE)
  string key = 2;                   // string(Provider), e.g. "onedrive" — what BeginConnectorAuth expects
  string display_name = 3;
  string connector_id = 4;
}

message ListConnectorProvidersResponse {
  repeated ConnectorProviderInfo providers = 1;
}

message RevokeConnectorRequest {
  string tenant_id = 1;
  string user_id = 2;
  string connector_id = 3;
}

message RevokeConnectorResponse {
  bool success = 1;
}

// ── Admin role/assignment types ──────────────────────────────────────────────

// AssignmentSection groups curated relations into the UI's sections.
enum AssignmentSection {
  ASSIGNMENT_SECTION_UNSPECIFIED = 0;
  GROUP_MEMBERSHIP = 1; // group#member / group#manager
  TENANT_ROLE = 2;      // tenant admin / member
  SKILL_ACCESS = 3;     // skill permitted_group
  AGENT_RELATION = 4;   // agent owner_user / spawned_by / can_delegate_to_user
  MCP_ACCESS = 5;       // mcp_connector permitted_agent / permitted_group
}

// RoleTuple is a single OpenFGA relationship in the curated admin surface.
message RoleTuple {
  string user = 1;     // "user:alice@example.com" | "group:security-team#member"
  string relation = 2; // "member" | "admin" | "permitted_group" | "owner_user" ...
  string object = 3;   // "group:security-team" | "tenant:aikonos-dev" | "skill:web.fetch"
  AssignmentSection section = 4;
}

// Principal is a user/group/agent the admin UI can target. Derived today from
// the Keycloak seed + observed FGA tuples; source marks its provenance.
message Principal {
  string id = 1;           // "user:alice@example.com" | "group:security-team" | "agent:alice-agent"
  string kind = 2;         // "user" | "group" | "agent"
  string display_name = 3;
  string source = 4;       // "keycloak" | "fga"
}

message ListAssignmentsRequest {
  string tenant_id = 1; // UUID; validated for request identity, FGA object derived server-side
  string user_id = 2;   // acting admin (echoed; OIDC identity preferred)
}

message ListAssignmentsResponse {
  repeated RoleTuple tuples = 1;
  repeated Principal principals = 2;
  bool fga_enabled = 3; // false in dev allow-all → UI shows a banner, hides mutations
  // Per-section read failures (e.g. one object-type read errored). The rest of
  // the response is still valid — the UI shows these as a degraded-mode notice.
  repeated string warnings = 4;
}

message ListSkillsRequest  { string tenant_id = 1; string user_id = 2; }
message AdminSkill {
  string tool_id      = 1;
  string scope        = 2;
  bool   enabled      = 3;
  string effect_class = 4; // authoritative rego string (e.g. "write_local")
  string display_name = 5;
  string description  = 6;
  string executor_kind = 7; // "builtin" | "mcp" | "" for capability-only skills
}
message ListSkillsResponse { repeated AdminSkill skills = 1; }

message UpsertSkillRequest {
  string tenant_id    = 1;
  string user_id      = 2;
  string tool_id      = 3;
  string effect_class = 4; // rego string; validated + floored server-side (I4)
  string display_name = 5;
  string description  = 6;
  bool   enabled      = 7;
  string scope        = 8; // optional; server derives and validates (I3)
}
message UpsertSkillResponse { AdminSkill skill = 1; }

message DeleteSkillRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string tool_id   = 3;
}
message DeleteSkillResponse {}

message AssignRoleRequest {
  string tenant_id = 1;
  string user_id = 2;
  RoleTuple tuple = 3;
}

message AssignRoleResponse {
  bool success = 1;
}

message RevokeRoleRequest {
  string tenant_id = 1;
  string user_id = 2;
  RoleTuple tuple = 3;
}

message RevokeRoleResponse {
  bool success = 1;
}

// ── Scheduler types ──────────────────────────────────────────────────────────

enum ScheduleKind {
  SCHEDULE_KIND_UNSPECIFIED = 0;
  SCHEDULE_KIND_CRON = 1;   // recurring; cron_expr holds a 5-field crontab spec
  SCHEDULE_KIND_ONCE = 2;   // one-off; run_at holds the firing time
}

enum ScheduledRunState {
  SCHEDULED_RUN_STATE_UNSPECIFIED = 0;
  SCHEDULED_RUN_ACTIVE = 1;
  SCHEDULED_RUN_PAUSED = 2;
  SCHEDULED_RUN_COMPLETED = 3; // a ONCE run that has fired
  SCHEDULED_RUN_FAILED = 4;
}

message ScheduledRun {
  string id = 1;
  string owner_user_id = 2;
  string prompt = 3;                          // unset for a workflow-mode schedule
  ScheduleKind kind = 4;
  string cron_expr = 5;                       // set for CRON
  google.protobuf.Timestamp next_fire_at = 6; // unset when paused/completed
  // Tools pre-authorized to run unattended even if they'd normally need human
  // approval. Never overrides an OPA DENY or a capability-scope failure.
  // Always empty on a workflow-mode schedule (approval derives from the
  // workflow itself at fire time).
  repeated string approved_tools = 7;
  ScheduledRunState state = 8;
  google.protobuf.Timestamp last_fire_at = 9;
  string last_status = 10;                     // COMPLETED | FAILED (last fire)
  string last_summary = 11;
  int32 run_count = 12;
  string created_by = 13;
  google.protobuf.Timestamp created_at = 14;
  // Workflow-mode fields (mutually exclusive with prompt). lineage_id unset
  // ⇒ prompt-mode schedule.
  string workflow_lineage_id = 15;
  map<string, string> workflow_inputs = 16;
  // Joined display name of the lineage's current approved version (List
  // only; never denormalized onto the row). Empty for a prompt-mode schedule.
  string workflow_display_name = 17;
}

message CreateScheduledRunRequest {
  string tenant_id = 1;
  string user_id = 2;
  string prompt = 3;                     // required unless workflow_lineage_id is set
  ScheduleKind kind = 4;
  string cron_expr = 5;                  // required for CRON
  google.protobuf.Timestamp run_at = 6;  // required for ONCE; must be in the future
  // Prompt-mode only; a workflow-mode create must leave this empty.
  repeated string approved_tools = 7;
  // Set to create a workflow-mode schedule instead of a prompt schedule;
  // mutually exclusive with prompt/approved_tools.
  string workflow_lineage_id = 8;
  map<string, string> workflow_inputs = 9;
}

message CreateScheduledRunResponse {
  ScheduledRun run = 1;
}

message ListScheduledRunsRequest {
  string tenant_id = 1;
  string user_id = 2;       // acting principal (OIDC identity preferred)
  // Empty → the caller's own runs. Set (including listing all via a sentinel the
  // gateway never sends) → tenant-admin gated filter by owner username.
  string owner_filter = 3;
}

message ListScheduledRunsResponse {
  repeated ScheduledRun runs = 1;
  bool fga_enabled = 2;
  repeated string warnings = 3;
}

message UpdateScheduledRunRequest {
  string tenant_id = 1;
  string user_id = 2;
  string id = 3;
  // Definition fields — applied when desired_state is UNSPECIFIED (a full edit).
  // On a workflow-mode row only kind/cron_expr/run_at (timing) may change;
  // prompt/approved_tools/workflow_lineage_id/workflow_inputs must echo the
  // row's existing (empty/immutable) values or the broker rejects the edit.
  string prompt = 4;
  ScheduleKind kind = 5;
  string cron_expr = 6;
  google.protobuf.Timestamp run_at = 7;
  repeated string approved_tools = 8;
  // When set to ACTIVE/PAUSED this is a state-only resume/pause and the
  // definition fields above are ignored.
  ScheduledRunState desired_state = 9;
  string workflow_lineage_id = 10;
  map<string, string> workflow_inputs = 11;
}

message UpdateScheduledRunResponse {
  ScheduledRun run = 1;
}

message DeleteScheduledRunRequest {
  string tenant_id = 1;
  string user_id = 2;
  string id = 3;
}

message DeleteScheduledRunResponse {
  bool success = 1;
}

// ── Scheduler south-bound (gateway ticker) types ─────────────────────────────

message ClaimDueScheduledRunsRequest {
  string tenant_id = 1;
  google.protobuf.Timestamp now = 2;
  int32 limit = 3;            // 0 → server default
}

// DueRun is the minimal payload the gateway needs to fire a run.
message DueRun {
  string id = 1;
  string owner_user_id = 2;
  string prompt = 3;                    // unset for a workflow-mode run
  repeated string approved_tools = 4;    // always empty for a workflow-mode run
  string owner_grant = 5;  // broker-issued HMAC owner-grant token (CP2); gateway echoes back to CreateGatewayTask
  // Workflow-mode fields (mutually exclusive with prompt/approved_tools).
  string workflow_lineage_id = 6;
  map<string, string> workflow_inputs = 7;
}

message ClaimDueScheduledRunsResponse {
  repeated DueRun runs = 1;
}

message ReportScheduledRunResultRequest {
  string tenant_id = 1;
  string id = 2;
  bool success = 3;
  string summary = 4;
  string session_id = 5;     // per-fire UUID; the file stem
  bytes  session_record = 6; // opaque JSON blob built by the gateway, written verbatim
}

message ReportScheduledRunResultResponse {}

// ── Network access-list types ────────────────────────────────────────────────

// NetworkRule is one host rule in the agent web access-list.
message NetworkRule {
  string id = 1;
  string scope_kind = 2;   // TENANT | GROUP | USER
  string scope_value = 3;  // group name / user email / "" for tenant
  string action = 4;       // ALLOW | DENY | ASK
  string host_pattern = 5; // "api.example.com" | "*.example.com" | "*"
  string note = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListNetworkRulesRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message ListNetworkRulesResponse {
  repeated NetworkRule rules = 1;
}

message AddNetworkRuleRequest {
  string tenant_id = 1;
  string user_id = 2;
  NetworkRule rule = 3; // id/created_by/created_at are server-assigned
}

message AddNetworkRuleResponse {
  NetworkRule rule = 1;
}

message DeleteNetworkRuleRequest {
  string tenant_id = 1;
  string user_id = 2;
  string id = 3;
}

message DeleteNetworkRuleResponse {
  bool success = 1;
