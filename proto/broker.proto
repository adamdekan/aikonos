  string tool_id = 1;
  string scope   = 2;
}

message ListUserSkillsResponse {
  repeated SkillItem skills = 1;
}

// ── Agent skill bundle types ──────────────────────────────────────────────────

// AgentSkillBundle is the wire representation of an agent_skill DB row.
// tenant_id is implicit from the auth context — not present in north request bodies.
message AgentSkillBundle {
  string          id                       = 1;
  string          name                     = 2;
  string          description              = 3;
  string          body                     = 4;
  repeated string allowed_tools            = 5;  // deprecated: dormant, not consumed
  bool            context_fork             = 6;
  bool            disable_model_invocation = 7;
  string          created_by               = 8;
  repeated string keywords                 = 9;  // admin-editable auto-load match terms; normalized (lowercase/trim/dedup) server-side
  repeated string file_paths               = 10; // full-tree file paths (relative, sorted ascending), no content — 
}

// North admin RPCs

message UpsertAgentSkillRequest {
  string          tenant_id                = 1;
  string          user_id                  = 2;
  string          id                       = 3;  // UUID; server-assigned on first insert when empty
  string          name                     = 4;
  string          description              = 5;
  string          body                     = 6;
  repeated string allowed_tools            = 7;
  bool            context_fork             = 8;
  bool            disable_model_invocation = 9;
  repeated string keywords                 = 10;
  map<string, bytes> files                 = 11; // relpath -> file content, stored verbatim into agent_skill.extras
}

message UpsertAgentSkillResponse {
  AgentSkillBundle bundle = 1;
}

message ListAgentSkillsRequest {
  string tenant_id = 1;
  string user_id   = 2;
}

message ListAgentSkillsResponse {
  repeated AgentSkillBundle bundles = 1;
}

message GetAgentSkillRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string id        = 3;  // UUID of the bundle
}

message GetAgentSkillResponse {
  AgentSkillBundle bundle = 1;
}

message DeleteAgentSkillRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string id        = 3;  // UUID of the bundle
}

message DeleteAgentSkillResponse {}

// South RPC

message ListUserAgentSkillsRequest {
  string tenant_id = 1;
  string user_id   = 2; // subject id (without the "user:" prefix)
}

message ListUserAgentSkillsResponse {
  repeated AgentSkillBundle bundles = 1;
}

message GetAgentSkillFileSouthRequest {
  string tenant_id = 1;
  string user_id   = 2; // subject id (without the "user:" prefix)
  string id        = 3; // UUID of the bundle
  string path      = 4; // relative path within the bundle's file tree
}

message GetAgentSkillFileSouthResponse {
  bytes content = 1;
}

// ── Rate limit messages ───────────────────────────────────────────────────────

message RateLimitPolicy {
  string id         = 1;
  string tenant_id  = 2;
  string agent_id   = 3; // empty = applies to all agents
  string provider   = 4; // empty = applies to all providers
  int32  rpm_limit  = 5; // 0 = deny-all; absent/−1 = unconstrained
  int32  tpm_limit  = 6;
  string created_by = 7;
}

// North admin RPCs

message ListRateLimitPoliciesRequest {
  string tenant_id = 1;
}

message ListRateLimitPoliciesResponse {
  repeated RateLimitPolicy policies = 1;
}

message SetRateLimitPolicyRequest {
  string tenant_id = 1;
  string agent_id  = 2;
  string provider  = 3;
  int32  rpm_limit = 4;
  int32  tpm_limit = 5;
}

message SetRateLimitPolicyResponse {
  string id = 1;
}

message DeleteRateLimitPolicyRequest {
  string tenant_id = 1;
  string id        = 2;
}

message DeleteRateLimitPolicyResponse {}

// South RPC — gateway calls before each LLM request

message CheckRateLimitRequest {
  string tenant_id = 1;
  string agent_id  = 2;
  string provider  = 3;
  string user_id   = 4; // additive — enables the per-user spend-cap check
}

message CheckRateLimitResponse {
  bool   allowed    = 1;
  string limit_type = 2; // "tpm_agent" | "tpm_provider" | "tpm_global" | "spend_org" | "spend_user" | "spend_agent"
}

// ── Spend cap messages ────────────────────────────
// Monthly (UTC calendar-month) LLM budget caps, scoped org/user/agent, checked
// after RPM/TPM in CheckRateLimit. cap_micros / spend_micros are integer
// micro-USD (1 USD = 1_000_000 micros).

message SpendCap {
  string id         = 1;
  string tenant_id  = 2;
  string scope      = 3; // "org" | "user" | "agent"
  string subject_id = 4; // "" for scope="org"
  int64  cap_micros = 5;
  string created_by = 6;
}

// North admin RPCs

message ListSpendCapsRequest {
  string tenant_id = 1;
}

message ListSpendCapsResponse {
  repeated SpendCap caps = 1;
}

message SetSpendCapRequest {
  string tenant_id  = 1;
  string scope      = 2;
  string subject_id = 3;
  int64  cap_micros = 4;
}

message SetSpendCapResponse {
  string id = 1;
}

message DeleteSpendCapRequest {
  string tenant_id = 1;
  string id        = 2;
}

message DeleteSpendCapResponse {}

message SpendSummaryUserRow {
  string user_id      = 1;
  int64  spend_micros = 2;
  int64  cap_micros   = 3; // 0 = unset
}

message SpendSummaryAgentRow {
  string agent_id     = 1;
  int64  spend_micros = 2;
  int64  cap_micros   = 3; // 0 = unset
}

message GetSpendSummaryRequest {
  string tenant_id = 1;
}

message GetSpendSummaryResponse {
  int64                         org_spend_micros = 1;
  int64                         org_cap_micros   = 2; // 0 = unset
  repeated SpendSummaryUserRow  users            = 3;
  repeated SpendSummaryAgentRow agents           = 4;
}

// ── Per-session usage ──────────────────────────
// One (provider, model) rollup of a single session's billable LLM calls, read
// from llm_usage_events — the same analytics table the LLM Spend dashboard
// bills from, so the figure the user sees and the figure an admin sees agree.
message SessionUsageRow {
  string provider    = 1;
  string model       = 2;
  int64  tokens_in   = 3;
  int64  tokens_out  = 4;
  int64  cache_read  = 5;
  int64  cache_write = 6;
  int64  cost_micros = 7;
  int64  calls       = 8;
}

message GetSessionUsageRequest {
  string tenant_id  = 1;
  string session_id = 2;
}

message GetSessionUsageResponse {
  repeated SessionUsageRow rows = 1;
}

// ── Org governance settings (A-series) ──────────────────────────────────────
// One settings object per tenant. Every field is `optional` so UpdateOrgSettings
// can carry a partial patch: only present fields are merged, absent fields are
// left untouched. GetOrgSettings responses populate every field with its
// effective value (stored value, or the documented default).
message OrgSettings {
  // A1 — org-global instruction preamble prepended to every session's system
  // prompt, ahead of the agent soul, as a governance-level (non-overridable)
  // block. Empty = no preamble.
  optional string instruction_preamble = 1;

  // A8 — org master for unattended / auto-approve mode. When false, an agent
  // configured with approval_mode:auto is downgraded to human-in-the-loop for
  // interactive runs regardless of its per-agent setting. Unset = true (allowed).
  optional bool unattended_allowed = 2;

  // A6 — org master over workflow sharing (Aikonos's user-authored, shareable
  // artifact). When false, PublishWorkflow is refused org-wide so members cannot
  // publish workflows to groups regardless of their skill:workflows grant.
  // Unset = true (allowed).
  optional bool workflow_sharing_allowed = 3;

  // A7 — connector install allowlist. When connector_allowlist_enabled is true,
  // BeginConnectorAuth is refused unless the provider id is in connector_allowlist.
  // When false (default), any configured connector may be linked. Provider ids
  // are the connector.Provider strings ("google_drive", "onedrive"). The two
  // fields travel together: presence of the enabled flag on an update applies both.
  optional bool   connector_allowlist_enabled = 4;
  repeated string connector_allowlist         = 5;

  // A2 — org capability master switches. Wrapped in a message so the repeated
  // list has proto3 presence: an update carrying `capabilities` replaces the
  // disabled set; an update without it leaves the set untouched.
  optional CapabilityPolicy capabilities = 6;

  // Audit / provenance (read-only; ignored on update).
  string updated_by = 100;
  string updated_at = 101; // RFC3339
}

// CapabilityPolicy is the org-wide capability kill-switch set. A tool whose
// authoritative effect class appears here is denied at InvokeTool org-wide,
// before the per-user FGA/capability gates — a master switch above delegation.
message CapabilityPolicy {
  // EffectClass enum names (e.g. "NETWORK_EGRESS", "WRITE_EXTERNAL").
  repeated string disabled_effect_classes = 1;
}

message GetOrgSettingsRequest {
  string tenant_id = 1;
}

message GetOrgSettingsResponse {
  OrgSettings settings = 1;
}

message UpdateOrgSettingsRequest {
  string tenant_id = 1;
  // Only the fields set on `settings` are applied (partial merge).
  OrgSettings settings = 2;
}

message UpdateOrgSettingsResponse {
  OrgSettings settings = 1; // the full, post-merge object
}

// A3 — unified members roster.
message MemberInfo {
  string subject       = 1; // OIDC subject (stable authz key)
  string email         = 2;
  string name          = 3; // display name
  string last_seen     = 4; // RFC3339; empty if never seen
  bool   provisioned   = 5; // true if JIT-provisioned (provisioned_at set)
  string provisioned_at = 6; // RFC3339; empty if manual
  bool   is_admin      = 7; // holds the tenant admin relation
}

message ListMembersRequest {
  string tenant_id = 1;
}

message ListMembersResponse {
  repeated MemberInfo members = 1;
}

// ── Workflow authoring RPC types (CP3) ───────────────────────────────────────

// SaveWorkflowRequest persists a gateway-authored Workflow as a private
// version. owner_grant is the broker-issued HMAC token that binds the owner
// identity — the same pattern as CreateGatewayTaskRequest.
message SaveWorkflowRequest {
  string tenant_id        = 1;
  string owner_user_id    = 2; // wire compat / logging; authz uses owner_grant
  string owner_grant      = 3; // broker-issued HMAC; required
  string name             = 4;
  string description      = 5;
  string definition_json  = 6; // canonical Workflow JSON (workflow.ToJSON output)
  string visibility_kind  = 7; // "private" (only private accepted at authoring time)
  // lineage_id: if non-empty, adds a new version under an existing lineage (edit).
  // If empty, a brand-new lineage is created (first save).
  string lineage_id       = 8;
  // F9: agent the workflow was authored under (bare agent UUID). Only honored
  // when creating a brand-new lineage — edits/proposals/forks inherit the
  // lineage's existing binding. Empty or non-UUID = personal (unbound) workflow.
  string agent_id         = 9;
}

message SaveWorkflowResponse {
  string workflow_id = 1; // UUID of the new row (id column)
  string lineage_id  = 2; // UUID of the lineage (new on first save)
  int32  version     = 3; // 1 for a brand-new lineage
}

// GetWorkflowRequest fetches the definition for a lineage, resolving the
// pin-or-current version for the requesting user.
message GetWorkflowRequest {
  string tenant_id   = 1;
  string owner_grant = 2; // broker-issued HMAC; required — binds runner identity
  string user_id     = 3; // requesting user (used for version-pin lookup)
  string lineage_id  = 4; // UUID of the workflow lineage
}

message GetWorkflowResponse {
  string definition_json = 1; // canonical Workflow JSON (workflow.ToJSON output)
  int32  version         = 2; // resolved version number
  string bound_agent_id  = 3; // F9: bare agent UUID the lineage is bound to; empty = personal
}

// ListWorkflowsRequest lists the workflows owned by the requesting user.
message ListWorkflowsRequest {
  string tenant_id   = 1;
  string owner_grant = 2; // broker-issued HMAC; required — binds owner identity
  string user_id     = 3; // requesting user (used for logging; authz uses owner_grant)
  // F19: additive pagination, following the audit-reader cursor convention
  // (proto/broker.proto QueryAuditRequest). limit=0 (proto3 default) →
  // legacy behavior: unbounded, every owned+shared workflow returned.
  int32  limit  = 4;
  string cursor = 5; // opaque; empty = first page
}

// WorkflowSummary is one item in a ListWorkflowsResponse: the current version
// of a lineage, with enough fields for a list card (name, status, visibility).
message WorkflowSummary {
  string          lineage_id            = 1;
  string          name                  = 2;
  int32           version               = 3;
  string          visibility_kind       = 4;
  string          status                = 5;
  // CP8: access state for the viewing user.
  // "runnable" — viewer holds all required skills.
  // "greyed_out" — viewer lacks one or more required skills.
  string          access_state          = 6;
  repeated string missing_requirements  = 7; // skills the viewer lacks (non-empty when greyed_out)
  bool            is_owner              = 8; // true when the viewer owns this lineage
  // F9: agent binding. bound_agent_id empty = personal workflow. bound_agent_ok
  // is true when the workflow is unbound, FGA is disabled, or the viewer may
  // operate the bound agent (can_use, or tenant admin) — the webui gates the
  // Run button on it; BeginWorkflowRun re-checks server-side.
  string          bound_agent_id        = 9;
  bool            bound_agent_ok        = 10;
}

message ListWorkflowsResponse {
  repeated WorkflowSummary items = 1;
  string next_cursor = 2; // empty = no more (F19)
  // shared_unavailable is true when the shared-workflow half of the listing
  // could not be resolved (FGA ListObjects or ListVisibleShared errored): the
  // response then carries own workflows only, and the client can surface a
  // degraded-listing notice instead of silently hiding shared workflows.
  bool shared_unavailable = 3;
}

// ── Agent-bound workflow run authorization (F9) ──────────────────────────────

// BeginWorkflowRunRequest asks the broker to authorize running the lineage's
// current workflow under its bound agent. Identity comes from the OIDC bearer
// (north path); owner_user_id is wire compat / logging only.
message BeginWorkflowRunRequest {
  string tenant_id     = 1;
  string owner_user_id = 2;
  string lineage_id    = 3;
}

// BeginWorkflowRunResponse: both fields empty when the workflow is unbound
// (personal) — run it on the legacy personal path. When bound, owner_grant is a
// broker-minted HMAC grant (task owner = the requesting user) and
// bound_agent_id is the bare agent UUID to run under.
message BeginWorkflowRunResponse {
  string owner_grant    = 1;
  string bound_agent_id = 2;
}

// ── Workflow self-improvement RPC types (CP6b) ────────────────────────────────

enum WorkflowRating {
  WORKFLOW_RATING_UNSPECIFIED = 0;
  RATING_SUCCESS = 1;
  RATING_BAD     = 2;
}

// RateWorkflowRun records a qualitative signal for a completed run.
// A BAD rating is an audit-only signal; it does not automatically create a
// proposal. The owner/agent calls ProposeWorkflowVersion separately.
message RateWorkflowRunRequest {
  string          tenant_id     = 1;
  string          owner_user_id = 2; // wire compat / logging; authz uses owner_grant
  string          owner_grant   = 3; // broker-issued HMAC; required
  string          lineage_id    = 4;
  int32           version       = 5; // which version was run
  WorkflowRating  rating        = 6;
  string          note          = 7; // optional free-text
}

message RateWorkflowRunResponse {}

// ProposeWorkflowVersion inserts a new proposed version of the workflow.
// Caller must be the lineage owner. Notifies the owner via an inbox envelope
// and emits a workflow.proposed audit event.
message ProposeWorkflowVersionRequest {
  string tenant_id       = 1;
  string owner_user_id   = 2; // wire compat / logging; authz uses owner_grant
  string owner_grant     = 3; // broker-issued HMAC; required
  string lineage_id      = 4;
  string definition_json = 5; // proposed workflow definition
}

message ProposeWorkflowVersionResponse {
  int32 version = 1; // version number assigned to the proposal
}

// DecideWorkflowVersion approves or rejects a proposed version.
// Caller must be the lineage owner.
message DecideWorkflowVersionRequest {
  string tenant_id     = 1;
  string owner_user_id = 2; // wire compat / logging; authz uses owner_grant
  string owner_grant   = 3; // broker-issued HMAC; required
  string lineage_id    = 4;
  int32  version       = 5; // proposed version to decide on
  bool   approved      = 6; // true = approve; false = reject
  string reason        = 7; // populated on rejection
}

message DecideWorkflowVersionResponse {
  string approval_state = 1; // "approved" | "rejected"
}

// ── Workflow publish messages (CP7) ───────────────────────────────────────────

// PublishWorkflowRequest publishes a success-rated workflow version to the
// owner's groups. The owner must be a member of every group_id supplied.
// owner_grant is required on the south path; ignored on the north path (OIDC).
message PublishWorkflowRequest {
  string          tenant_id     = 1;
  string          owner_user_id = 2; // wire compat / logging; authz uses owner_grant (south) or OIDC (north)
  string          owner_grant   = 3; // broker-issued HMAC; required on south path
  string          lineage_id    = 4;
  int32           version       = 5;
  repeated string group_ids     = 6; // groups to share with; owner must be a member of each
}

message PublishWorkflowResponse {
  string          visibility_kind = 1; // "shared"
  repeated string groups          = 2; // group ids the workflow was published to
}

// ── Workflow fork + version-pin message types (CP9) ──────────────────────────

// ForkWorkflowRequest creates a new independent lineage copied from the source
// lineage's current approved definition. The forker becomes the new owner.
message ForkWorkflowRequest {
  string tenant_id        = 1;
  string owner_user_id    = 2; // asserted on south path; ignored on north (identity from bearer)
  string owner_grant      = 3; // HMAC grant — required on south path only
  string source_lineage_id = 4; // lineage to fork from
  string new_name         = 5; // REQUIRED: name for the forked workflow
}

message ForkWorkflowResponse {
  string lineage_id = 1; // UUID of the newly created fork lineage
}

// SetWorkflowVersionPinRequest pins the caller's personal view of a lineage to
// a specific version. The target version must be in state 'approved'.
message SetWorkflowVersionPinRequest {
  string tenant_id     = 1;
  string owner_user_id = 2;
  string owner_grant   = 3;
  string lineage_id    = 4;
  int32  version       = 5;
}

message SetWorkflowVersionPinResponse {}

// ClearWorkflowVersionPinRequest removes the caller's pin for a lineage,
// reverting their view to the auto-latest approved version.
message ClearWorkflowVersionPinRequest {
  string tenant_id     = 1;
  string owner_user_id = 2;
  string owner_grant   = 3;
  string lineage_id    = 4;
}

message ClearWorkflowVersionPinResponse {}

// ListWorkflowVersionsRequest returns all versions for a lineage. Skill-gated.
// owner_grant required on the south path; ignored on the north path (OIDC).
message ListWorkflowVersionsRequest {
  string tenant_id     = 1;
  string owner_user_id = 2;
  string owner_grant   = 3;
  string lineage_id    = 4;
  // F19: additive pagination, following the audit-reader cursor convention.
  // limit=0 (proto3 default) → legacy behavior: unbounded, every version
  // returned.
  int32  limit  = 5;
  string cursor = 6; // opaque; empty = first page
}

// WorkflowVersionSummary is one row in a ListWorkflowVersionsResponse.
message WorkflowVersionSummary {
  int32  version        = 1;
  string approval_state = 2; // "approved" | "proposed" | "rejected"
  string created_at     = 3; // RFC3339
}

message ListWorkflowVersionsResponse {
  repeated WorkflowVersionSummary items = 1;
  string next_cursor = 2; // empty = no more (F19)
}

// DeleteWorkflowRequest removes an entire lineage. Owner-only; owner_grant
// required on the south path, ignored on the north path (identity from bearer).
message DeleteWorkflowRequest {
  string tenant_id     = 1;
  string owner_user_id = 2;
  string owner_grant   = 3;
  string lineage_id    = 4;
}

message DeleteWorkflowResponse {
  int32 versions_deleted = 1; // number of version rows removed
}

// ── Workflow document types (no service RPCs — those come in later checkpoints) ──

// WorkflowVisibility declares who can see a workflow.
// kind must be "private" or "shared".
message WorkflowVisibility {
  string          kind   = 1;
  repeated string groups = 2;
}

// WorkflowMetadata holds identifying and lifecycle fields for a Workflow.
message WorkflowMetadata {
  string             name        = 1;
  string             description = 2;
  int32              version     = 3;
  string             owner       = 4;
  WorkflowVisibility visibility  = 5;
}

// WorkflowRequires is the access manifest compared against a runner's grants
// to determine runnable vs greyed-out state.
message WorkflowRequires {
  repeated string scopes = 1;
  repeated string skills = 2;
  repeated string agents = 3;
}

// WorkflowInput declares one parameterized input slot.
message WorkflowInput {
  string name = 1;
  // schema_json carries the JSON Schema fragment as a serialised JSON string.
  // Proto3 has no map<string,any> type, so the open-typed map[string]any from
  // the Go struct is JSON-encoded before being placed here. The CP3/CP4 bridge
  // must json.Marshal on the Go→proto path and json.Unmarshal (treating an
  // empty string or "null" as an empty map) on the proto→Go path.
  string schema_json = 2;
  string default     = 3;
}

// WorkflowStep is one authored tool invocation in the linear step sequence.
message WorkflowStep {
  string skill = 1;
  // args_json carries the step's args map as a serialised JSON object.
  // Same impedance as WorkflowInput.schema_json: proto3 cannot represent
  // map<string,any>, so the Go map[string]any is JSON-encoded before storage.
  // The CP3/CP4 bridge must guard null→empty-map on the proto→Go path.
  string args_json = 2;
}

// Workflow is the canonical representation of a kind: Workflow document.
// Mirrors broker/internal/workflow.Workflow; stored as JSONB in the DB.
message Workflow {
  string          api_version = 1;
  string          kind        = 2;
  WorkflowMetadata metadata   = 3;
  WorkflowRequires requires   = 4;
  repeated WorkflowInput inputs = 5;
  repeated WorkflowStep  steps  = 6;
}

// ── Agent memory management messages ─────────────

// MemoryConceptMeta is one concept's frontmatter, flattened for the wire.
// Bodies are deliberately absent — every listing surface is frontmatter-only.
message MemoryConceptMeta {
  string id          = 1;
  string scope       = 2;  // "user" | "group" | "agent"
  string group_id    = 3;  // set only for scope="group"
  string agent_id    = 4;  // set only for scope="agent"
  string type        = 5;
  string title       = 6;
  string description = 7;
  repeated string tags = 8;
  string status      = 9;  // "draft" | "stable" | "deprecated"
  // trust_tier is derived, never stored: "unverified" | "machine-confirmed" |
  // "human-reviewed" (any human: entry in `verified` wins).
  string trust_tier  = 10;
  bool   stale       = 11; // derived: today >= stale_after
  string stale_after = 12; // YYYY-MM-DD, empty when unset
  string generated_by = 13; // server-stamped "user:<sub>" or "agent:<id>"
  string generated_at = 14; // RFC3339
}

// MemoryGroup is one group the caller may reach, with the relations that
// decide which actions the settings UI offers.
message MemoryGroup {
  string group_id = 1;
  bool   member   = 2;
  bool   manager  = 3; // manager may verify/deprecate/delete the shared bundle
}

message ListMemoryGroupsRequest {
  string tenant_id = 1;
  string user_id   = 2;
}

message ListMemoryGroupsResponse {
  repeated MemoryGroup groups = 1;
}

// ListMemoryConceptsRequest carries explicit identity fields (north validates
// them against the bearer via callerIdentity; the SPIFFE-gated south twin
// trusts the gateway peer) — same shape as GetWorkspaceBackendRequest.
message ListMemoryConceptsRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string scope     = 3; // "user" | "group" | "agent"; ignored by the south twin
  string group_id  = 4; // required iff scope="group"
  string agent_id  = 5; // required iff scope="agent"; south: recall the agent bundle
}

message ListMemoryConceptsResponse {
  repeated MemoryConceptMeta concepts = 1;
}

message GetMemoryConceptRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string scope     = 3;
  string group_id  = 4;
  string agent_id  = 5;
  string id        = 6;
}

message GetMemoryConceptResponse {
  MemoryConceptMeta meta = 1;
  string            body = 2;
}

message VerifyMemoryConceptRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string scope     = 3;
  string group_id  = 4;
  string agent_id  = 5;
  string id        = 6;
}

message VerifyMemoryConceptResponse {
  MemoryConceptMeta meta = 1; // the amended concept, trust_tier recomputed
}

message DeprecateMemoryConceptRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string scope     = 3;
  string group_id  = 4;
  string agent_id  = 5;
  string id        = 6;
}

message DeprecateMemoryConceptResponse {
  MemoryConceptMeta meta = 1;
}

message DeleteMemoryConceptRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string scope     = 3;
  string group_id  = 4;
  string agent_id  = 5;
  string id        = 6;
}

message DeleteMemoryConceptResponse {}

// ── Personal skills — south RPCs ─────────────
// CP2 scope: only the two south (SPIFFE-gated) session-build RPCs are wired
// on SandboxService. North management/transfer RPCs are a later checkpoint.

message ListPersonalSkillsSouthRequest {
  string tenant_id = 1;
  string user_id   = 2;
}

message ListPersonalSkillsSouthResponse {
  repeated PersonalSkillEntry skills = 1;
}

// PersonalSkillEntry is one discovered personal skill's catalog row
// (frontmatter only — no body). name is always the directory name.
message PersonalSkillEntry {
  string          name                     = 1;
  string          description              = 2;
  repeated string keywords                 = 3;
  repeated string allowed_tools            = 4;  // deprecated: dormant, not consumed
  bool            disable_model_invocation = 5;
  // valid is false when the skill is excluded from the catalog (missing/
  // unparseable/oversize SKILL.md, or a missing description); warning then
  // carries the human-readable reason. warning may also be set with valid
  // still true, on a frontmatter/directory name mismatch.
  bool   valid   = 6;
  string warning = 7;
}

message GetPersonalSkillSouthRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string name      = 3;
}

message GetPersonalSkillSouthResponse {
  string          body          = 1; // markdown after the frontmatter fence
  repeated string allowed_tools = 2; // deprecated: dormant, not consumed
  repeated string file_paths    = 3; // full-tree file paths under Skills/<name>/ minus SKILL.md (relative, sorted ascending)
}

message GetPersonalSkillFileSouthRequest {
  string tenant_id = 1;
  string user_id   = 2;
  string name      = 3;
  string path      = 4; // relative path within Skills/<name>/, excluding SKILL.md
}

message GetPersonalSkillFileSouthResponse {
  bytes content = 1;
}
