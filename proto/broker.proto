  bool   reads_sensitive             = 5;
  string fga_object                  = 6; // optional; if set, CheckFGA(subject, "can_access", object)
}

message SimulatePolicyResponse {
  string outcome                 = 1; // ALLOW | DENY | NEEDS_HUMAN | NEEDS_STEP_UP
  repeated GateDecision gates    = 2; // identity, access(fga), routing, network, capability
}

