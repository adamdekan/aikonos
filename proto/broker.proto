  string tenant_id = 1;
  string user_id   = 2;  // acting admin (echoed; OIDC identity preferred)
  string agent_id  = 3;  // bare UUID
  string label     = 4;  // optional human label
}

message MintAgentApiKeyResponse {
  AgentApiKey key     = 1;
