// ResolveAgentApiKeyRequest carries the sha256(raw_key) hex digest.
// The gateway computes sha256 locally; the broker applies the pepper.
message ResolveAgentApiKeyRequest {
  string key_hash_hex = 1;  // hex-encoded sha256(raw_key)
  string tenant_id    = 2;  // used for RLS + cross-tenant guard
}

message ResolveAgentApiKeyResponse {
  bool   valid       = 1;
  string agent_id    = 2;   // bare UUID (if valid)
  string tenant_id   = 3;   // UUID string (if valid)
  string principal   = 4;   // "svc-<agentId>" (if valid)
  string owner_grant = 5;   // broker-issued HMAC owner-grant token for "svc-<agentId>" (CP2); gateway threads into CreateGatewayTask
}

// ── LLM provider messages ─────────────────────────────────────────────────────

message LlmModel {
  string id               = 1;
  // price_* (2-5) are the legacy per-model float fields: dead since migration
  // 042 moved costing to integer micro rates. Kept for models JSONB compat.
  double price_in         = 2;
  double price_out        = 3;
  double price_cache_read = 4;
  double price_cache_write = 5;
  int32  context_window   = 6;
  int32  max_tokens       = 7;
  // modality this model serves: chat | embedding | image_generation |
  // audio_speech | audio_transcription | rerank | ocr | moderation.
  // Empty = "chat".
  string mode             = 8;
  // per-model pricing; absent = fall back to the provider's flat token rates.
  LlmModelPricing pricing = 9;
}

// LlmModelPricing is one model's unit-discriminated price record. The unit
// decides which amounts are meaningful: per_mtok uses all four token rates,
// every other unit uses in_micros as its single per-unit amount.
message LlmModelPricing {
  string unit               = 1; // per_mtok | per_image | per_megapixel | per_mchar | per_minute | per_second | per_page | per_1k_queries | per_request | free
  int64  in_micros          = 2; // micro-USD per unit (per 1M input tokens for per_mtok)
  int64  out_micros         = 3; // 0 where the unit has no output side
  int64  cache_read_micros  = 4; // per_mtok only
  int64  cache_write_micros = 5; // per_mtok only
  repeated LlmPricingTier tiers = 6; // per_mtok only; context-length-tiered rates
}

// LlmPricingTier is a context-length-tiered rate override (OpenRouter shape):
// once the call's input side reaches min_context_tokens, these rates replace
// the top-level in/out rates. Cache rates are never tiered.
message LlmPricingTier {
  int64 min_context_tokens = 1;
  int64 in_micros          = 2;
  int64 out_micros         = 3;
}

message LlmProvider {
  string            id         = 1;
  string            name       = 2;
  string            endpoint   = 3;
  string            api        = 4;
  repeated LlmModel models     = 5;
  bool              enabled    = 6;
  bool              is_default = 7;
  bool              has_key    = 8;
  string            updated_by = 9;
  string            api_key    = 10; // south GetLlmProviders only; never set on north List
  string            api_version = 11; // required when api == "azure-openai" (classic Azure deployment route)
  bool              vision_capable    = 12;
  bool              is_default_vision = 13;
  int64             price_in_micros_per_mtok  = 14; // cost fallback: micro-USD per 1M input tokens, 0 = unpriced
  int64             price_out_micros_per_mtok = 15; // cost fallback: micro-USD per 1M output tokens, 0 = unpriced
  bool              is_fallback = 16;
  // family-specific config. Allowed keys per api: aws-bedrock → "region";
  // every other family → none (azure keeps the api_version field above).
  map<string, string> config = 17;
}

// North admin RPCs

message ListLlmProvidersRequest {}

message ListLlmProvidersResponse {
  repeated LlmProvider providers = 1;
  // capability → provider id, from llm_provider_defaults. Capabilities:
  // chat | vision | fallback | embedding | image_generation | audio_speech |
  // audio_transcription | rerank | ocr. A capability with no default is absent.
  map<string, string> defaults = 2;
}

message UpsertLlmProviderRequest {
  LlmProvider provider = 1;
  string      api_key  = 2; // write-only; omit to leave existing key unchanged
}

message UpsertLlmProviderResponse {}

message DeleteLlmProviderRequest {
  string id = 1;
}

message DeleteLlmProviderResponse {}

message SetDefaultProviderRequest {
  string id = 1;
}

message SetDefaultProviderResponse {}

message SetDefaultVisionProviderRequest {
  string id = 1;
}

message SetDefaultVisionProviderResponse {}

