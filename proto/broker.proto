// ── Gateway south task twins (south-bound, gateway-only) ──────────────────────

// CreateGatewayTaskRequest is the south-twin of CreateTaskRequest.
// owner_grant (field 6) is the broker-issued HMAC token that proves the owner;
// the broker binds the task owner from the grant, not from owner_user_id.
message CreateGatewayTaskRequest {
  string tenant_id      = 1;
  string owner_user_id  = 2;  // kept for wire compat / logging; NOT trusted for authz — broker derives owner from owner_grant
  string prompt         = 3;
  uint64 cost_budget    = 4;  // 0 → server default (1000)
  string agent_id       = 5;  // optional: binds the task to a named agent; broker enforces skill boundary at SubmitPlan
  string owner_grant    = 6;  // required (CP2): broker-issued HMAC owner-grant token; absent → PermissionDenied
  string client_request_id = 7;  // Optional idempotency key; empty = today's behavior
}

// ApproveGatewayTaskRequest is the south-twin of ApproveTaskRequest.
// owner_user_id (field 3) is DEPRECATED / ignored for authorization — the
// broker derives the approver from the stored task row (CP2). Kept for wire
// compat with pre-CP2 gateway versions.
message ApproveGatewayTaskRequest {
  string tenant_id      = 1;
  string task_id        = 2;
  string owner_user_id  = 3;  // DEPRECATED (CP2): ignored for authz; broker derives approver from stored task
  bool   approved       = 4;
  string reason         = 5;
}

