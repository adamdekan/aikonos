// ── Audit read-side types ─────────────────────────────────────────────────────

message QueryAuditRequest {
  // tenant is the caller's — NOT a field here.
  google.protobuf.Timestamp start_time = 1; // inclusive, optional
  google.protobuf.Timestamp end_time   = 2; // inclusive, optional
  string actor_user_id = 3;                 // optional exact match
  string event_type    = 4;                 // optional exact match
  aikonos.audit.v1.PolicyDecision decision = 5; // optional; UNSPECIFIED = any
  int32  limit  = 6;                        // server caps (e.g. 200); 0 → default 50
  string cursor = 7;                        // opaque; empty = first page
}

message QueryAuditResponse {
  repeated aikonos.audit.v1.AuditEvent events = 1; // newest first
  string next_cursor = 2;                         // empty = no more
  bool   store_configured = 3;                     // false in logging-only mode
}

message VerifyAuditChainRequest {}  // tenant = caller's

message ChainBreak {
  string event_id = 1;
  string detail   = 2;
}

message VerifyAuditChainResponse {
  int32  total            = 1;
  bool   ok               = 2; // no breaks AND no signature failures
  bool   signed           = 3; // signing key configured → signatures checked
  bool   store_configured = 4;
  string head_event_id    = 5;
  string tail_event_id    = 6;
  repeated ChainBreak breaks             = 7; // continuity breaks
  repeated ChainBreak signature_failures = 8; // HMAC mismatches
  // ok=true with truncated=true or skipped>0 means only the scanned subset was
  // verified — the client must treat this as "verified the part I read, not the
  // whole chain".
  bool  truncated = 9; // true when the store had more than maxScanObjects objects
  int32 skipped   = 10; // count of objects that failed to fetch/decode and were skipped
}

// ── Decision trace ────────────────────────────────────────────────────────────

message GetDecisionTraceRequest {
  string task_id = 1; // tenant = caller's (from OIDC context)
}

message GateDecision {
  string gate    = 1; // "identity" | "access_routing" | "network" | "capability"
  string outcome = 2; // ALLOW | DENY | NEEDS_HUMAN | NEEDS_STEP_UP | ASK | INFO
  string rule_id = 3; // empty if n/a
  string reason  = 4; // human-readable
  string detail  = 5; // optional extra (scope, host, etc.)
}

message StepTrace {
  int32  seq          = 1;
  string tool_id      = 2;
  string effect_class = 3;
  string decision     = 4; // aggregate policy_decision for this step
  string justification = 5;
  repeated GateDecision gates = 6;
}

message GetDecisionTraceResponse {
  string task_id         = 1;
  repeated StepTrace steps = 2;
}

