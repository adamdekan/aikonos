name: Desktop

# aikonOS for Windows (desktop/). A workflow of its own so the Windows build
# runs only when the app (or the web styles it copies) changes; the server side
# of it (the web server's /desktop.json) is covered by CI's webui job.
on:
  push:
    branches: ["**"]
    paths:
      - "desktop/**"
      # The app's tests compare its theme and icons with these.
      - "webui/web/src/styles/tokens.css"
      - "webui/web/src/components/Icon.vue"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "desktop/**"
      # The app's tests compare its theme and icons with these.
      - "webui/web/src/styles/tokens.css"
      - "webui/web/src/components/Icon.vue"
      - ".github/workflows/desktop.yml"

# Least privilege: the job only reads the repo and uploads an artifact.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-test:
    name: Desktop client (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # desktop/rust-toolchain.toml pins the toolchain and its components.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}
          restore-keys: desktop-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build the app
        run: cargo build --release --locked

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aikonos-windows
          path: desktop/target/release/aikonos.exe
          if-no-files-found: error
