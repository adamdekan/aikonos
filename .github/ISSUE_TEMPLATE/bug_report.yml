name: Bug report
description: Something behaves differently from what the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a suspected vulnerability here. Use
        [Security → Report a vulnerability](../../security/advisories/new),
        which is private.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. task compose:up
        2. task compose:seed
        3. Sign in as alice@example.com
        4. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or the release tag.
    validations:
      required: true

  - type: dropdown
    id: variant
    attributes:
      label: Deployment variant
      options:
        - local (.env.local.example, bundled Keycloak)
        - local with an external OIDC provider
        - on-prem (.env.onprem.example)
        - azure (.env.azure.example)
        - other
    validations:
      required: true

  - type: dropdown
    id: seeded
    attributes:
      label: Was enforcement seeded?
      description: >
        An unseeded stack runs in dev allow-all mode and behaves differently.
        The broker logs `OpenFGA is disabled — dev allow-all mode` when it is.
      options:
        - "Yes, task compose:seed completed"
        - "No, or I am not sure"
    validations:
      required: true

  - type: input
    id: verify
    attributes:
      label: task compose:verify result
      description: The final count line, for example "20 passed, 1 failed".

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        From `docker compose logs broker` or `docker compose logs agent-gateway`.
        Redact tokens and keys before pasting.
      render: shell
